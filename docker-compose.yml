services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowra
      POSTGRES_USER: flowra
      POSTGRES_PASSWORD: flowra
    ports:
      - "5432:5432"
    volumes:
      - flowra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowra -d flowra"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - flowra_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./config/backend.env
    ports:
      - "8080:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/worker"]
    env_file:
      - ./config/backend.env
    depends_on:
      backend-api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_API_KEY: local-flowra-key
    env_file:
      - ./config/frontend.env
    ports:
      - "3000:3000"
    depends_on:
      - backend-api

volumes:
  flowra_postgres_data:
  flowra_redis_data:
